[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dicojev"
version = "1.2.0"
description = "Coverage-aware Jev-style decision making over diffusion-generated action sets with typed low-bandwidth feedback"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Yucheng Liu"}]
license = {file = "LICENSE"}
keywords = [
  "decision-making",
  "diffusion-language-model",
  "agents",
  "multimodal",
  "uncertainty",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
cross-encoder = ["sentence-transformers>=3"]
media = [
  "faster-whisper>=1.1,<2",
  "opencv-python-headless>=4.10,<5",
  "pypdf>=5",
  "python-docx>=1.1",
]

[project.urls]
Homepage = "https://github.com/YuchengLiu0424/DiCoJev"
Documentation = "https://github.com/YuchengLiu0424/DiCoJev/tree/main/docs"
Issues = "https://github.com/YuchengLiu0424/DiCoJev/issues"
Source = "https://github.com/YuchengLiu0424/DiCoJev"

[project.scripts]
dicojev-api = "dicojev.cli:main"
dicojev-gui = "dicojev.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dicojev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an explicitly enabled external model/service"]

[tool.ruff]
line-length = 100
