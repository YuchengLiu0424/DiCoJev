[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffusion-decision"
version = "0.1.0"
description = "Coverage-aware multimodal DLM decision harness with pluggable structured decision backends"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
