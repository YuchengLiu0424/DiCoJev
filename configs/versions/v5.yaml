project: {milestone: v5, package_version: 1.0.0}
model:
  generator_kind: llada
  generator_model: llada-v-local
  multimodal: true
  deployment: unified_local_runtime
  base_url: http://127.0.0.1:8002
  timeout_seconds: 600
decision_backend: {kind: native_dlm}
runtime:
  share_model_weights: true
  share_multimodal_preprocessing: true
  reuse_context_when_equivalent: true
  batch_reads: false
controller:
  policy: threshold
  min_coverage: 0.75
  min_selection_confidence: 0.70
  expansion_cost: 0.50
  token_cost_weight: 0.0
feedback: {compiler: typed_low_bandwidth, expose_trace: true}
api: {enabled: true, endpoint: /v1/decide}
