project: {milestone: v1, package_version: 0.2.0}
model:
  generator_kind: diffusiongemma
  generator_model: google/diffusiongemma-26B-A4B-it
  deployment: local
  base_url: http://127.0.0.1:8000
  timeout_seconds: 60
decision_backend:
  kind: djev_local
  base_url: http://127.0.0.1:8011
